<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Lumi</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #dff1f7;
        overflow: hidden;
        height: 100%;
        /* Pensado para móvil: el arrastre del joystick táctil no debe
           disparar scroll, pull-to-refresh ni el zoom por doble toque del
           navegador. */
        touch-action: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        /* Safari en iOS calcula 100vh contando el área que tapa la barra
           de direcciones (no lo que realmente se ve), así que el juego
           quedaba más alto de lo visible de verdad — la cruceta (fija
           cerca del borde inferior "lógico") terminaba recortada fuera de
           pantalla, y todo se veía más recortado/zoomeado que en un
           navegador de escritorio. 100dvh sí refleja el viewport visible
           real; se declara DESPUÉS de 100vh como mejora progresiva (los
           navegadores que no conocen dvh simplemente ignoran esta línea y
           se quedan con el 100vh de arriba). */
        height: 100dvh;
        touch-action: none;
      }
      canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }

      /* Pedido explícito: el juego solo se diseña para móvil en vertical
         — en horizontal se tapa el juego con un aviso en vez de intentar
         adaptar niveles/D-pad a ese formato. */
      #rotate-notice {
        display: none;
      }
      /* pointer: coarse = dispositivo táctil (evita disparar el aviso en
         un navegador de escritorio con la ventana ancha y baja). */
      @media (orientation: landscape) and (pointer: coarse) {
        #game {
          display: none;
        }
        #rotate-notice {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div
      id="rotate-notice"
      style="
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        text-align: center;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #3a3a5a;
        background: #dff1f7;
      "
    >
      <div style="font-size: 40px">📱</div>
      <p style="margin: 0; font-size: 18px">Gira tu móvil a vertical para jugar a Lumi</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
